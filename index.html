<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cr4xy.dev</title>
  <style>
    html {
      overflow: hidden;
    }
    html, body {
      margin: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
  <script>
    function main() {
      const can = document.getElementById("can"),
            ctx = can.getContext("2d");
      window.addEventListener("resize", () => {
        can.width = window.innerWidth;
        can.height = window.innerHeight;
      });
      can.width = window.innerWidth;
      can.height = window.innerHeight;
      let fullText = "Hello World", text;
      function render() {
        //ctx.clearRect(0, 0, can.width, can.height);
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, can.width, can.height);
        ctx.fillStyle = ctx.strokeStyle = "#eee";
        //ctx.beginPath();
        //ctx.moveTo(0, 0);
        //ctx.lineTo(can.width / 2, can.height / 2);
        //ctx.closePath();
        //ctx.stroke();
        let textHeight = 27;
        let cursorPosX = 10, cursorPosY = textHeight + 10;
        ctx.font = textHeight + "px Consolas";
        let textWidth = ctx.measureText("M").width;
        text = fullText.substr(0, Date.now() % 1000 / 1000 * (fullText.length + 1));
        ctx.fillText(text, cursorPosX, cursorPosY);
        cursorPosX += ctx.measureText(text).width;
        if (Date.now() % 2000 > 1000) {
          ctx.strokeRect(cursorPosX, cursorPosY - textHeight - 5, textWidth, textHeight + 5);
        }

        ctx.save();
        ctx.translate(300, 200);
        let offset = Math.floor(Date.now() % 3000 / 3000 * 100);
        for (let x = -offset; x < offset; x++) {
          for (let y = -offset; y < offset; y++) {
            if (x % y == 0) {
              ctx.fillRect(x, y, 1, 1);
            }
          }
        }
        ctx.restore();

        ctx.save();
        ctx.translate(200, 400);
        offset = Date.now() % 1000 / 1000;
        for (let x = 0; x < 100; x++) {
          ctx.fillRect(x, Math.sin((offset + x / 100) * Math.PI * 2) * 10, 1, 1);
        }
        ctx.restore();

        requestAnimationFrame(render);
      }
      render();
    }
  </script>
</head>
<body onload="main()">
  <canvas id="can"></canvas>
  <noscript>No javascript, no fun</noscript>
</body>
</html>
